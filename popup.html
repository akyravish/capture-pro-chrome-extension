<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d12;
      --surface: #16161e;
      --surface-2: #1e1e28;
      --surface-3: #252532;
      --border: #2c2c3e;
      --border-light: #38384e;
      --accent: #7c6af7;
      --accent-bright: #9b8dff;
      --accent-glow: rgba(124, 106, 247, 0.3);
      --accent-tint: rgba(124, 106, 247, 0.1);
      --accent-tint-2: rgba(124, 106, 247, 0.18);
      --red: #f06060;
      --red-glow: rgba(240, 96, 96, 0.25);
      --red-tint: rgba(240, 96, 96, 0.12);
      --text: #f0f0f8;
      --text-2: #b8b8d0;
      --text-3: #7a7a96;
      --success: #56d999;
      --toggle-off: #2c2c3e;
      --toggle-on: #7c6af7;
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      user-select: none;
      overflow: hidden;
    }

    /* ── Tab bar ────────────────────────────── */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 13px 0 11px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-3);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.01em;
      margin-bottom: -1px;
    }

    .tab-btn:hover { color: var(--text-2); }

    .tab-btn.active {
      color: var(--accent-bright);
      border-bottom-color: var(--accent);
    }

    .tab-icon {
      width: 16px;
      height: 16px;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    .tab-btn.active .tab-icon,
    .tab-btn:hover .tab-icon { opacity: 1; }

    /* ── Tab panels ─────────────────────────── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ══════════════════════════════════════════
       CAPTURE TAB
    ══════════════════════════════════════════ */
    .capture-panel { padding: 16px; }

    .source-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .source-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 18px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s, transform 0.12s;
      position: relative;
      overflow: hidden;
    }

    .source-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, var(--accent-tint-2), transparent 70%);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .source-card:hover {
      border-color: var(--accent);
      background: var(--surface-2);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .source-card:hover::before { opacity: 1; }
    .source-card:active { transform: translateY(0); }

    .source-card.selected {
      border-color: var(--accent);
      background: var(--surface-2);
      box-shadow: 0 0 0 1px var(--accent), 0 6px 24px var(--accent-glow);
    }
    .source-card.selected::before { opacity: 1; }

    .source-card-icon {
      width: 44px;
      height: 44px;
      color: var(--text-3);
      transition: color 0.15s;
    }
    .source-card:hover .source-card-icon,
    .source-card.selected .source-card-icon { color: var(--accent-bright); }

    .source-card-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      text-align: center;
      transition: color 0.15s;
      line-height: 1.3;
    }
    .source-card:hover .source-card-label,
    .source-card.selected .source-card-label { color: var(--text); }

    /* ══════════════════════════════════════════
       RECORD TAB
    ══════════════════════════════════════════ */
    .record-panel { padding: 14px 16px 16px; }

    /* Tab sound row */
    .setting-row {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      margin-bottom: 8px;
    }

    .setting-row-icon {
      width: 17px; height: 17px;
      color: var(--text-3);
      flex-shrink: 0;
      margin-right: 9px;
    }

    .setting-row-label {
      flex: 1;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-2);
    }

    /* CSS toggle switch */
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: var(--toggle-off);
      border: 1px solid var(--border-light);
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--text-3);
      transition: transform 0.2s, background 0.2s;
      pointer-events: none;
    }

    .toggle input:checked + .toggle-track { background: var(--toggle-on); border-color: var(--accent); }
    .toggle input:checked + .toggle-track + .toggle-thumb {
      transform: translateX(16px);
      background: #fff;
    }

    /* Quality buttons */
    .quality-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .quality-btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .quality-btn:hover {
      border-color: var(--border-light);
      background: var(--surface-2);
      color: var(--text);
    }

    .quality-btn.active {
      border-color: var(--accent);
      background: var(--accent-tint);
      color: var(--accent-bright);
      box-shadow: 0 0 0 1px var(--accent);
    }

    /* Info banner */
    .info-banner {
      padding: 9px 12px;
      background: var(--accent-tint);
      border: 1px solid rgba(124,106,247,0.22);
      border-radius: 8px;
      font-size: 12.5px;
      color: var(--text-2);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    /* Start recording CTA */
    .cta-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #8b7aff 0%, #6655e8 100%);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      letter-spacing: 0.01em;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .cta-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(124,106,247,0.45);
      filter: brightness(1.08);
    }
    .cta-btn:active { transform: translateY(0); filter: brightness(0.96); }

    .cta-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .cta-sub {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.75;
    }

    /* ── Option rows (format / delay) ──────── */
    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      width: 42px;
      flex-shrink: 0;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .option-btns {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    .option-btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 7px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-3);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .option-btn:hover {
      border-color: var(--border-light);
      color: var(--text-2);
      background: var(--surface-2);
    }

    .option-btn.active {
      border-color: var(--accent);
      background: var(--accent-tint);
      color: var(--accent-bright);
    }

    /* ── Status ─────────────────────────────── */
    .status {
      margin: 10px 16px 0;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 8px;
      line-height: 1.3;
    }
    .status.show { display: flex; }
    .status.info    { background: var(--accent-tint); color: var(--accent-bright); border: 1px solid rgba(124,106,247,0.22); }
    .status.error   { background: var(--red-tint); color: #ffaaaa; border: 1px solid rgba(240,96,96,0.22); }
    .status.success { background: rgba(86,217,153,0.1); color: var(--success); border: 1px solid rgba(86,217,153,0.22); }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* ── Footer ─────────────────────────────── */
    .footer {
      padding: 9px 14px 10px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .footer-version {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.04em;
    }

  </style>
</head>
<body>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabCapture">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Capture
    </button>
    <button class="tab-btn" id="tabRecord">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      Record
    </button>
  </div>

  <!-- ═══ CAPTURE PANEL ═══ -->
  <div class="tab-panel active" id="panelCapture">
    <div class="capture-panel">
      <div class="source-grid">

        <!-- Selected Area: crosshair / crop corners -->
        <div class="source-card" id="cardArea" data-action="startAreaSelector">
          <svg class="source-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8V5a2 2 0 0 1 2-2h3"/>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
            <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
            <circle cx="12" cy="12" r="1" fill="currentColor"/>
          </svg>
          <span class="source-card-label">Selected Area</span>
        </div>

        <!-- This Tab: browser window with cursor -->
        <div class="source-card" id="cardViewport" data-action="startViewportCapture">
          <svg class="source-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="14" rx="2"/>
            <line x1="2" y1="8" x2="22" y2="8"/>
            <circle cx="5" cy="6" r="0.8" fill="currentColor" stroke="none"/>
            <circle cx="8" cy="6" r="0.8" fill="currentColor" stroke="none"/>
            <circle cx="11" cy="6" r="0.8" fill="currentColor" stroke="none"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="18" x2="12" y2="21"/>
          </svg>
          <span class="source-card-label">This Tab</span>
        </div>

        <!-- Full Page PDF -->
        <div class="source-card" id="cardFullPage" data-action="printPage">
          <svg class="source-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"/>
            <line x1="8" y1="7"  x2="16" y2="7"/>
            <line x1="8" y1="11" x2="16" y2="11"/>
            <line x1="8" y1="15" x2="13" y2="15"/>
            <path d="M14 17l2 2 3-3" stroke-width="1.8"/>
          </svg>
          <span class="source-card-label">Full Page PDF</span>
        </div>

        <!-- Visible Viewport: screen with highlight frame -->
        <div class="source-card" id="cardDesktop" data-action="startViewportCapture">
          <svg class="source-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
            <rect x="6" y="7" width="12" height="6" rx="1" stroke-dasharray="2.5 1.5"/>
          </svg>
          <span class="source-card-label">Visible Viewport</span>
        </div>

      </div>

      <!-- Format picker -->
      <div class="option-row" style="margin-top:10px;">
        <span class="option-label">Format</span>
        <div class="option-btns">
          <button class="option-btn format-btn active" data-format="png">PNG</button>
          <button class="option-btn format-btn" data-format="jpeg">JPEG</button>
          <button class="option-btn format-btn" data-format="webp">WebP</button>
        </div>
      </div>

      <!-- Delay capture -->
      <div class="option-row" style="margin-top:8px;">
        <span class="option-label">Delay</span>
        <div class="option-btns">
          <button class="option-btn delay-btn active" data-delay="0">None</button>
          <button class="option-btn delay-btn" data-delay="1">1s</button>
          <button class="option-btn delay-btn" data-delay="3">3s</button>
          <button class="option-btn delay-btn" data-delay="5">5s</button>
        </div>
      </div>

    </div>

    <div class="status" id="statusCapture">
      <div class="dot"></div>
      <span id="statusCaptureText"></span>
    </div>
  </div>

  <!-- ═══ RECORD PANEL ═══ -->
  <div class="tab-panel" id="panelRecord">
    <div class="record-panel">

      <!-- Tab sound toggle -->
      <div class="setting-row">
        <svg class="setting-row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <span class="setting-row-label">Tab Sound</span>
        <label class="toggle">
          <input type="checkbox" id="toggleTabSound" checked />
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>

      <!-- Quality buttons -->
      <div class="quality-row">
        <button class="quality-btn" data-res="480">480p</button>
        <button class="quality-btn active" data-res="720">720p</button>
        <button class="quality-btn" data-res="1080">1080p</button>
      </div>

      <!-- Info banner -->
      <div class="info-banner">
        Tab audio is captured with the recording. Toggle it off above to record silently.
      </div>

      <!-- CTA -->
      <button class="cta-btn" id="btnStartRecord">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="8"/>
        </svg>
        Start Recording
        <span class="cta-sub" id="ctaResLabel">(720p)</span>
      </button>

    </div>

    <div class="status" id="statusRecord">
      <div class="dot"></div>
      <span id="statusRecordText"></span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-version">v1.0 · MV3</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
