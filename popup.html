<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0f;
      --surface: #141418;
      --surface-raised: #1a1a20;
      --border: #2a2a38;
      --accent: #8b7aff;
      --accent-dim: #7c6af7;
      --accent-glow: rgba(139, 122, 255, 0.28);
      --red: #f06060;
      --red-glow: rgba(240, 96, 96, 0.22);
      --text: #f0f0f8;
      --text-secondary: #b0b0c8;
      --muted: #6b6b80;
      --success: #56d999;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      padding: 0;
      user-select: none;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 16px;
      background: linear-gradient(135deg, #111116 0%, #161620 60%, #0e0e14 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -30px; left: -20px;
      width: 160px; height: 100px;
      background: radial-gradient(ellipse, rgba(139,122,255,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(145deg, #9b8dff, #5b4de8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 0 18px rgba(139,122,255,0.4), 0 2px 8px rgba(0,0,0,0.4);
      flex-shrink: 0;
      position: relative;
    }

    .title {
      font-family: 'Space Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #ffffff 0%, #c8c0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
      letter-spacing: 0.01em;
    }

    /* ── Content area ───────────────────────── */
    .content {
      padding: 18px 16px 14px;
    }

    /* ── Section labels ─────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-gap {
      height: 16px;
    }

    /* ── Buttons ─────────────────────────────── */
    .btn {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      margin-bottom: 7px;
      position: relative;
      overflow: hidden;
      text-align: left;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }

    /* Left accent bar on hover */
    .btn::after {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px;
      border-radius: 0 2px 2px 0;
      opacity: 0;
      transition: opacity 0.15s, top 0.15s, bottom 0.15s;
    }

    .btn:hover { transform: translateY(-1px); background: var(--surface-raised); }
    .btn:active { transform: translateY(0); }

    .btn-image::before { background: radial-gradient(circle at 20% 50%, var(--accent-glow), transparent 65%); }
    .btn-image:hover { border-color: var(--accent-dim); box-shadow: 0 4px 22px var(--accent-glow); }
    .btn-image:hover::before { opacity: 1; }
    .btn-image::after { background: var(--accent); }
    .btn-image:hover::after { opacity: 1; top: 15%; bottom: 15%; }

    .btn-video::before { background: radial-gradient(circle at 20% 50%, var(--red-glow), transparent 65%); }
    .btn-video:hover { border-color: var(--red); box-shadow: 0 4px 22px var(--red-glow); }
    .btn-video:hover::before { opacity: 1; }
    .btn-video::after { background: var(--red); }
    .btn-video:hover::after { opacity: 1; top: 15%; bottom: 15%; }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .btn:hover .btn-icon { transform: scale(1.08); }

    .btn-image .btn-icon { background: rgba(139, 122, 255, 0.14); }
    .btn-video .btn-icon { background: rgba(240, 96, 96, 0.14); }

    .btn-text { flex: 1; }

    .btn-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      line-height: 1.3;
    }

    .btn-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
      line-height: 1.3;
    }

    .btn-arrow {
      color: var(--muted);
      font-size: 18px;
      transition: transform 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .btn:hover .btn-arrow { color: var(--text); transform: translateX(3px); }

    /* ── Status ─────────────────────────────── */
    .status {
      margin: 10px 0 0;
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 9px;
      line-height: 1.3;
    }
    .status.show { display: flex; }
    .status.info    { background: rgba(139,122,255,0.1); color: #b4aaff; border: 1px solid rgba(139,122,255,0.22); }
    .status.error   { background: rgba(240,96,96,0.1);  color: #ffaaaa; border: 1px solid rgba(240,96,96,0.22); }
    .status.success { background: rgba(86,217,153,0.1); color: var(--success); border: 1px solid rgba(86,217,153,0.22); }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ── Footer ─────────────────────────────── */
    .footer {
      padding: 10px 16px 14px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      font-family: 'Space Mono', monospace;
      border-top: 1px solid var(--border);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">📸</div>
    <div>
      <div class="title">CAPTURE PRO</div>
      <div class="subtitle">Screenshot · Record · Download</div>
    </div>
  </div>

  <div class="content">

    <div class="section-label">Image Capture</div>

    <button class="btn btn-image" id="btnPickElement">
      <div class="btn-icon">✂️</div>
      <div class="btn-text">
        <div class="btn-title">Selected Area</div>
        <div class="btn-desc">Drag to select a region</div>
      </div>
      <span class="btn-arrow">›</span>
    </button>

    <button class="btn btn-image" id="btnViewport">
      <div class="btn-icon">🖥️</div>
      <div class="btn-text">
        <div class="btn-title">Visible Viewport</div>
        <div class="btn-desc">Capture what's on screen now</div>
      </div>
      <span class="btn-arrow">›</span>
    </button>

    <button class="btn btn-image" id="btnFullPage">
      <div class="btn-icon">📄</div>
      <div class="btn-text">
        <div class="btn-title">Full Page</div>
        <div class="btn-desc">Capture entire scrollable page</div>
      </div>
      <span class="btn-arrow">›</span>
    </button>

    <div class="section-gap"></div>
    <div class="section-label">Video</div>

    <button class="btn btn-video" id="btnRecord">
      <div class="btn-icon">🔴</div>
      <div class="btn-text">
        <div class="btn-title">Record Tab</div>
        <div class="btn-desc">Screen capture → download .webm</div>
      </div>
      <span class="btn-arrow">›</span>
    </button>

    <div class="status" id="status">
      <div class="dot"></div>
      <span id="statusText"></span>
    </div>

  </div>

  <div class="footer">MV3 · Works on all pages</div>

  <script src="popup.js"></script>
</body>
</html>
